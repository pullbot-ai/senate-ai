name: Train Bundle

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle ID to train (0-88)'
        required: true
        type: number

permissions:
  actions: write
  contents: read

jobs:
  train-conservative:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      
      - run: pip install torch numpy pyyaml
      
      - name: Train conservative
        run: python src/train.py ${{ github.event.inputs.bundle_id }} --strategy conservative --epochs 5 --lr 0.0005
      
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ github.event.inputs.bundle_id }}-conservative
          path: senate_bundles/bundle_${{ github.event.inputs.bundle_id }}*.pt

  train-aggressive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      
      - run: pip install torch numpy pyyaml
      
      - name: Train aggressive
        run: python src/train.py ${{ github.event.inputs.bundle_id }} --strategy aggressive --epochs 2 --lr 0.01
      
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ github.event.inputs.bundle_id }}-aggressive
          path: senate_bundles/bundle_${{ github.event.inputs.bundle_id }}*.pt

  train-curriculum:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      
      - run: pip install torch numpy pyyaml
      
      - name: Train curriculum
        run: python src/train.py ${{ github.event.inputs.bundle_id }} --strategy curriculum --epochs 4 --lr 0.001
      
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ github.event.inputs.bundle_id }}-curriculum
          path: senate_bundles/bundle_${{ github.event.inputs.bundle_id }}*.pt

  train-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      
      - run: pip install torch numpy pyyaml
      
      - name: Train adversarial
        run: python src/train.py ${{ github.event.inputs.bundle_id }} --strategy adversarial --epochs 3 --lr 0.002
      
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ github.event.inputs.bundle_id }}-adversarial
          path: senate_bundles/bundle_${{ github.event.inputs.bundle_id }}*.pt

  trigger-next:
    needs: [train-conservative, train-aggressive, train-curriculum, train-adversarial]
    if: ${{ github.event.inputs.bundle_id < 88 }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger next bundle
        run: |
          NEXT=$(( ${{ github.event.inputs.bundle_id }} + 1 ))
          curl -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/train_bundle.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"bundle_id\":\"$NEXT\"}}"
