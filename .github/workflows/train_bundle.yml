name: Train Topics Parallel

on:
  workflow_dispatch:
    inputs:
      topics:
        description: 'Comma-separated topics (will be split into parallel jobs)'
        required: true
        type: string

permissions:
  actions: write
  contents: write

jobs:
  train-topic-0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}
          restore-keys: pip-${{ runner.os }}-
      - run: pip install torch numpy pyyaml
      - name: Train first topic
        run: |
          TOPIC=$(echo "${{ github.event.inputs.topics }}" | cut -d',' -f1)
          python src/train.py --topics $TOPIC --epochs 3 --lr 0.001
      - name: Push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add senate_bundles/
          git commit -m "Train $TOPIC" || echo "No changes"
          git push

  train-topic-1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}
          restore-keys: pip-${{ runner.os }}-
      - run: pip install torch numpy pyyaml
      - name: Train second topic
        run: |
          TOPIC=$(echo "${{ github.event.inputs.topics }}" | cut -d',' -f2)
          python src/train.py --topics $TOPIC --epochs 3 --lr 0.001
      - name: Push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add senate_bundles/
          git commit -m "Train $TOPIC" || echo "No changes"
          git push

  train-topic-2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}
          restore-keys: pip-${{ runner.os }}-
      - run: pip install torch numpy pyyaml
      - name: Train third topic
        run: |
          TOPIC=$(echo "${{ github.event.inputs.topics }}" | cut -d',' -f3)
          python src/train.py --topics $TOPIC --epochs 3 --lr 0.001
      - name: Push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add senate_bundles/
          git commit -m "Train $TOPIC" || echo "No changes"
          git push

  train-topic-3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}
          restore-keys: pip-${{ runner.os }}-
      - run: pip install torch numpy pyyaml
      - name: Train fourth topic
