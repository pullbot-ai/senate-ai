name: Train Bundle

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle ID (0-88)'
        required: true
        type: number

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install torch numpy pyyaml
      
      - uses: actions/download-artifact@v3
        with:
          name: senate-models
          path: models/
        continue-on-error: true
      
      - uses: actions/download-artifact@v3
        with:
          name: training-data
          path: training_data/
        continue-on-error: true
      
      - run: python src/train.py ${{ github.event.inputs.bundle_id }}
      
      - uses: actions/upload-artifact@v3
        with:
          name: senate-models
          path: models/
      
      - uses: actions/upload-artifact@v3
        with:
          name: grading-reports
          path: reports/
