name: Train Topics

on:
  workflow_dispatch:
    inputs:
      topic_group:
        description: 'Topic group to train'
        required: true
        type: choice
        options:
          - math
          - science
          - cs
          - humanities
          - social
          - arts
          - medical

permissions:
  contents: write

jobs:
  train-math:
    if: ${{ github.event.inputs.topic_group == 'math' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}
          restore-keys: pip-${{ runner.os }}-
      - run: pip install torch numpy pyyaml
      - name: Train math topics
        run: python src/train.py --topics mathematics,algebra,geometry,calculus,statistics --epochs 3 --lr 0.001
      - name: Push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add senate_bundles/
          git commit -m "Train math topics" || echo "No changes"
          git push

  train-science:
