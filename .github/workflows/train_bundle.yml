          restore-keys: pip-${{ runner.os }}-
      - run: pip install torch numpy pyyaml
      - name: Train fifth topic
        run: |
          TOPIC=$(echo "${{ github.event.inputs.topics }}" | cut -d',' -f5)
          python src/train.py --topics $TOPIC --epochs 3 --lr 0.001
