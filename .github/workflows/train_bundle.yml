name: Train Bundle

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle ID to train (0-88)'
        required: true
        type: number

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install torch numpy pyyaml
      
      - uses: actions/download-artifact@v3
        with:
          name: senate-models
          path: models/
        continue-on-error: true
      
      - uses: actions/download-artifact@v3
        with:
          name: training-data
          path: training_data/
        continue-on-error: true
      
      - name: Train bundle
        run: python src/train.py ${{ github.event.inputs.bundle_id }}
      
      - uses: actions/upload-artifact@v3
        with:
          name: senate-models
          path: models/
      
      - name: Trigger next bundle
        if: ${{ github.event.inputs.bundle_id < 88 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEXT=$(( ${{ github.event.inputs.bundle_id }} + 1 ))
          curl -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/train_bundle.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"bundle_id\":\"$NEXT\"}}"
