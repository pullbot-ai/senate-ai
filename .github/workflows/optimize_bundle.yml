name: Optimize Bundle

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle ID to optimize (0-88)'
        required: true
        type: number
      target_sparsity:
        description: 'Target sparsity (0.3-0.7)'
        required: false
        default: '0.5'

permissions:
  actions: write
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - run: pip install torch numpy pyyaml
      
      - name: Optimize bundle ${{ github.event.inputs.bundle_id }}
        run: |
          python src/optimize.py \
            ${{ github.event.inputs.bundle_id }} \
            ${{ github.event.inputs.target_sparsity }}
      
      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
      
      - name: Push optimized bundle
        run: |
          git add senate_bundles/bundle_$(printf "%03d" ${{ github.event.inputs.bundle_id }}).pt
          git commit -m "Optimize bundle ${{ github.event.inputs.bundle_id }}"
          git push
      
      - name: Trigger next bundle
        if: ${{ github.event.inputs.bundle_id < 88 }}
        run: |
          NEXT=$(( ${{ github.event.inputs.bundle_id }} + 1 ))
          curl -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/optimize_bundle.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"bundle_id\":\"$NEXT\",\"target_sparsity\":\"${{ github.event.inputs.target_sparsity }}\"}}"
