name: Optimize All

on:
  workflow_dispatch:
    inputs:
      target_sparsity:
        description: 'Target sparsity (0.3-0.7)'
        required: false
        default: '0.5'

permissions:
  actions: write

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Start bundle 0
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/optimize_bundle.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"bundle_id\":\"0\",\"target_sparsity\":\"${{ github.event.inputs.target_sparsity }}\"}}"
