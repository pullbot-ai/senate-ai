name: Export GGUF

on:
  workflow_dispatch:
    inputs:
      max_size:
        description: 'Max file size in MB'
        required: false
        default: '300'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      
      - run: pip install torch numpy pyyaml
      
      - name: Export all senators to GGUF
        run: python src/export_gguf.py --max-size ${{ github.event.inputs.max_size }}
      
      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git lfs track "gguf_exports/*.gguf"
      
      - name: Push manifest and small files
        run: |
          git add gguf_exports/manifest.json .gitattributes
          git commit -m "Export GGUF manifest"
          git push
      
      - name: Push GGUF files one at a time
        run: |
          for f in gguf_exports/*.gguf; do
            echo "Pushing $(basename $f)..."
            git add "$f"
            git commit -m "Add $(basename $f)"
            git push || {
              echo "Retrying..."
              sleep 10
              git push
            }
          done
