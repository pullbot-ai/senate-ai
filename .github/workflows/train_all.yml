name: Train All

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Start training chain
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/train_bundle.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"bundle_id\":\"0\"}}"
