name: Train Router

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - run: pip install torch numpy pyyaml requests
      
      - run: python src/router_model.py
      
      - name: Push router model
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add models/router.pt
          git commit -m "Train router model"
          git push
