name: Senate Debate

on:
  workflow_dispatch:
    inputs:
      question:
        description: 'Question for the Senate'
        required: true
        type: string

permissions:
  contents: read

jobs:
  debate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - run: pip install torch numpy pyyaml
      
      - name: Write debate script
        run: |
          cat > debate.py << 'ENDOFPYTHON'
          import sys
          sys.path.insert(0, "src")
          from senate import Senate
          import os
          
          question = os.environ["DEBATE_QUESTION"]
          
          senate = Senate()
          result = senate.ask(question)
          
          print()
          print("=" * 60)
          print("  SENATE FINAL ANSWER")
          print("=" * 60)
          print()
          print("Question:", question)
          print("Answer:", result["consensus"])
          print(f"Confidence: {result['confidence']:.1%}")
          print("Rounds:", result["rounds"])
          print("Senators:", result["senators_involved"])
          print("Topics:", ", ".join(result["topics"]))
          ENDOFPYTHON
        env:
          DEBATE_QUESTION: ${{ github.event.inputs.question }}
      
      - name: Run debate
        env:
          DEBATE_QUESTION: ${{ github.event.inputs.question }}
        run: python debate.py
