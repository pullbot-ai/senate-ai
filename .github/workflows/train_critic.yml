name: Train Critic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - run: pip install pyyaml requests
      
      - run: python src/train_critic.py
      
      - name: Push critic data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add critic_training/
          git commit -m "Train critic with difficulty levels 1-5"
          git push
