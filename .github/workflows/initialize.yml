name: Initialize Senate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - run: pip install torch numpy pyyaml
      
      - run: python src/generate_training_data.py
      - run: python src/initialize.py
      
      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git config http.postBuffer 524288000
          git config pack.windowMemory "50m"
          git config pack.packSizeLimit "50m"
          git config pack.threads "1"
      
      - name: Push training data and index
        run: |
          git add training_data/ senate_bundles/senate_index.json
          git commit -m "Add training data and index"
          git push
      
      - name: Push bundles 5 at a time
        run: |
          for chunk in $(seq 0 5 85); do
            end=$((chunk + 4))
            if [ $end -gt 88 ]; then end=88; fi
            
            start_padded=$(printf "%03d" $chunk)
            end_padded=$(printf "%03d" $end)
            echo "Pushing bundles $start_padded to $end_padded..."
            
            for i in $(seq -w $chunk $end); do
              git add senate_bundles/bundle_${i}.pt
            done
            
            git commit -m "Bundles $start_padded-$end_padded"
            git push || {
              echo "Push failed, retrying..."
              sleep 10
              git push
            }
          done
