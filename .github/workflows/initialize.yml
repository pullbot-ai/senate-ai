name: Initialize Senate

on:
  workflow_dispatch:

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - run: pip install torch numpy pyyaml
      
      - run: python src/generate_training_data.py
      - run: python src/initialize.py
      
      - name: Push training data to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add training_data/ senate_bundles/senate_index.json
          git commit -m "Add training data and senate index"
          git push
      
      - uses: actions/upload-artifact@v4
        with:
          name: senate-bundle-000-029
          path: senate_bundles/bundle_0[0-2][0-9].pt
          retention-days: 90
      
      - uses: actions/upload-artifact@v4
        with:
          name: senate-bundle-030-059
          path: senate_bundles/bundle_0[3-5][0-9].pt
          retention-days: 90
      
      - uses: actions/upload-artifact@v4
        with:
          name: senate-bundle-060-088
          path: senate_bundles/bundle_0[6-8][0-9].pt
          retention-days: 90
