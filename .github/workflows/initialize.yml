name: Initialize Senate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - run: pip install torch numpy pyyaml
      
      - run: python src/generate_training_data.py
      - run: python src/initialize.py
      
      - name: Create Release with bundles
        uses: softprops/action-gh-release@v2
        with:
          name: Senate Initialized
          tag_name: senate-v1
          body: All 4005 senators in 89 bundles
          files: models/bundle_*.pt
