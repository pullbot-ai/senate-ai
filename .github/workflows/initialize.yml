name: Initialize Senate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - run: pip install torch numpy pyyaml
      
      - run: python src/generate_training_data.py
      - run: python src/initialize.py
      
      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git config pack.windowMemory "100m"
          git config pack.packSizeLimit "100m"
          git config pack.threads "1"
      
      - name: Push training data
        run: |
          git add training_data/
          git commit -m "Add training data"
          git push
      
      - name: Push index
        run: |
          git add senate_bundles/senate_index.json
          git commit -m "Add senate index"
          git push
      
      - name: Push bundles 000-019
        run: |
          git add senate_bundles/bundle_00[0-9].pt senate_bundles/bundle_01[0-9].pt
          git commit -m "Bundles 000-019"
          git push
      
      - name: Push bundles 020-039
        run: |
          git add senate_bundles/bundle_02[0-9].pt senate_bundles/bundle_03[0-9].pt
          git commit -m "Bundles 020-039"
          git push
      
      - name: Push bundles 040-059
        run: |
          git add senate_bundles/bundle_04[0-9].pt senate_bundles/bundle_05[0-9].pt
          git commit -m "Bundles 040-059"
          git push
      
      - name: Push bundles 060-079
        run: |
          git add senate_bundles/bundle_06[0-9].pt senate_bundles/bundle_07[0-9].pt
          git commit -m "Bundles 060-079"
          git push
      
      - name: Push bundles 080-088
        run: |
          git add senate_bundles/bundle_08[0-9].pt
          git commit -m "Bundles 080-088"
          git push
