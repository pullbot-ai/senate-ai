name: Initialize Senate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - run: pip install torch numpy pyyaml
      
      - run: python src/generate_training_data.py
      - run: python src/initialize.py
      
      - name: Setup Git LFS for bundle files
        run: |
          git lfs install
          git lfs track "senate_bundles/bundle_*.pt"
          git add .gitattributes
      
      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
      
      - name: Push everything
        run: |
          git add training_data/ senate_bundles/ .gitattributes
          git commit -m "Initialize Senate - 4005 senators"
          git push
