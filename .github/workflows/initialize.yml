name: Initialize Senate

on:
  workflow_dispatch:

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install torch numpy pyyaml
      - run: python src/generate_training_data.py
      - run: python src/initialize.py
      - uses: actions/upload-artifact@v3
        with:
          name: senate-models
          path: models/
      - uses: actions/upload-artifact@v3
        with:
          name: training-data
          path: training_data/
