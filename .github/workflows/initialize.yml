name: Initialize Senate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - run: pip install torch numpy pyyaml
      
      - run: python src/generate_training_data.py
      - run: python src/initialize.py
      
      - name: Commit and push to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add senate_bundles/ training_data/
          git commit -m "Initialize 4005 senators in 89 bundles" || echo "Nothing to commit"
          git push
